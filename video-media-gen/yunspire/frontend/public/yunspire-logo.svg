<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" fill="none">
  <!-- Film reel icon -->
  <circle cx="30" cy="30" r="22" stroke="currentColor" stroke-width="3" fill="none"/>
  <circle cx="30" cy="30" r="8" stroke="currentColor" stroke-width="2.5" fill="none"/>

  <!-- Film strip perforations (top) -->
  <rect x="14" y="8" width="6" height="4" rx="1" fill="currentColor" opacity="0.6"/>
  <rect x="32" y="8" width="6" height="4" rx="1" fill="currentColor" opacity="0.6"/>

  <!-- Film strip perforations (bottom) -->
  <rect x="14" y="48" width="6" height="4" rx="1" fill="currentColor" opacity="0.6"/>
  <rect x="32" y="48" width="6" height="4" rx="1" fill="currentColor" opacity="0.6"/>

  <!-- Film strip perforations (left) -->
  <rect x="8" y="14" width="4" height="6" rx="1" fill="currentColor" opacity="0.6"/>
  <rect x="8" y="32" width="4" height="6" rx="1" fill="currentColor" opacity="0.6"/>

  <!-- Film strip perforations (right) -->
  <rect x="48" y="14" width="4" height="6" rx="1" fill="currentColor" opacity="0.6"/>
  <rect x="48" y="32" width="4" height="6" rx="1" fill="currentColor" opacity="0.6"/>

  <!-- Play triangle inside film reel -->
  <polygon points="25,22 25,38 40,30" fill="currentColor" opacity="0.9"/>

  <!-- YUNSPIRE text -->
  <text x="62" y="42" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" font-weight="700" letter-spacing="2" fill="currentColor">
    YUN<tspan fill="currentColor" font-weight="900">SPIRE</tspan>
  </text>

  <!-- STUDIO subtitle -->
  <text x="64" y="54" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="10" font-weight="400" letter-spacing="5" fill="currentColor" opacity="0.5">
    STUDIO
  </text>
</svg>
